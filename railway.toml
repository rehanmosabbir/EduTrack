# Railway service config for the EduTrack Express API.
# In the Railway dashboard: set Root Directory to `/` (repo root),
# attach a volume at /data/uploads, and set UPLOAD_DIR=/data/uploads.

[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run build -w backend"

[deploy]
startCommand = "npm run start -w backend"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[env]
UPLOAD_DIR = "/data/uploads"
NODE_ENV = "production"
