services:
  postgres:
    image: postgres:16-alpine
    container_name: edutrack-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: edutrack
      POSTGRES_PASSWORD: edutrack
      POSTGRES_DB: edutrack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edutrack -d edutrack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
